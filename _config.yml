title: League of Perpetual Awesomeness
description: Weekly fantasy football recaps
theme: minima

# IMPORTANT: set this to match how you name your GitHub repo.
#   - If your repo is named exactly "<your-username>.github.io", set: baseurl: ""
#   - If your repo has any other name (e.g. "fantasy_recap"), set: baseurl: "/fantasy_recap"
#     (must start with a slash, no trailing slash)
baseurl: "/fantasy_recap"

# Shows newest posts first (default), and lets Jekyll build post URLs
# like /2026/09/15/week-1-recap.html
permalink: /:year/:month/:day/:title.html

# Absolute site address — used for link previews (Open Graph) and the feed
url: "https://harrisongross17.github.io"

# The look comes from _layouts/, _includes/ and assets/css/league.css.
# minima stays as the base theme, but every page uses our own layouts.
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Header wordmark (small line above, big line below) and founding year
wordmark_top: "League of"
wordmark_main: "Perpetual Awesomeness"
founded: 2014

# Division badge colors, keyed by ESPN division name
divisions:
  "Whites": { bg: "#eef0f2", fg: "#111111" }
  "Blacks": { bg: "#000000", fg: "#eef0f2", border: "#3a414b" }

# Main label on scorecards, standings and awards: "manager" or "team"
primary_label: manager

# Show ESPN team names next to managers on scorecards and standings.
# The site is public, so these are visible to anyone with the link.
show_team_names: false

# Default link-preview image for anything shared in a group chat
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-card.png

# Keep the setup README out of the built site (it's for you, not readers)
exclude:
  - README.md
