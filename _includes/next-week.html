<div class="next-week">
{%- for m in wd.next_week %}
  <div class="preview">
    <div class="pv-side"><span class="mgr">{{ m.home.manager }}</span><span class="team">{{ m.home.record }}</span></div>
    <div class="pv-vs">vs</div>
    <div class="pv-side right"><span class="mgr">{{ m.away.manager }}</span><span class="team">{{ m.away.record }}</span></div>
    <div class="pv-series">{{ m.series }}{% if m.meetings > 0 %} · {{ m.meetings }} meetings{% endif %}</div>
  </div>
{%- endfor %}
</div>
